services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships amd64 images; this lets Apple Silicon Macs run it through emulation.
    platform: linux/amd64
    container_name: doomsday_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build: ./backend
    container_name: doomsday_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: "sqlserver://db:1433;database=${DB_NAME:-doomsday_ready};user=sa;password=${DB_PASSWORD:-YourStrong!Passw0rd};trustServerCertificate=true"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: doomsday_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mssql_data:
